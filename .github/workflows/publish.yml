name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - name: Build
        env:
          BENDAY_PUBLIC_ORIGIN: https://benday.qex.at
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # One bcrypt line per person lives in the BETA_HTPASSWD secret, never in
      # the repository. An empty secret fails the run rather than publishing an
      # open site, and revoking a person is deleting their line.
      - name: Beta credentials
        env:
          BETA_HTPASSWD: ${{ secrets.BETA_HTPASSWD }}
        run: |
          if [ -z "$BETA_HTPASSWD" ]; then
            echo "BETA_HTPASSWD is empty: refusing to publish the beta unguarded" >&2
            exit 1
          fi
          printf '%s\n' "$BETA_HTPASSWD" > dist/.htpasswd
      - name: Publish
        uses: yitianyigexiangfa/ssh-scp-ssh-pipelines@v1.1.5
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          pass: ${{ secrets.PASS }}
          # the action joins these lines with && so each script must stay a
          # single line: no heredoc, no comments, and no $ expansion, which it
          # resolves on the runner instead of the server.
          first_ssh: mkdir -p ./www/benday.qex.at
          scp: |
            ./dist/* => ./www/benday.qex.at/
            ./dist/.htaccess => ./www/benday.qex.at/
            ./dist/.htpasswd => ./www/benday.qex.at/
          # ENVIRON["PWD"] is resolved by awk on the server, which is the only
          # place the absolute path exists.
          last_ssh: awk '{gsub(/__PWD__/,ENVIRON["PWD"])}1' ./www/benday.qex.at/.htaccess > ./www/benday.qex.at/.htaccess.tmp && mv ./www/benday.qex.at/.htaccess.tmp ./www/benday.qex.at/.htaccess && chmod 600 ./www/benday.qex.at/.htpasswd && test -f ./www/benday.qex.at/.htpasswd && stat -c '%a %n' ./www/benday.qex.at/.htaccess ./www/benday.qex.at/.htpasswd
