name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - name: Build
        env:
          BENDAY_PUBLIC_ORIGIN: https://benday.qex.at
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # The admin Basic Auth credential lives in BETA_HTPASSWD, never in the
      # repository. An empty secret fails rather than publishing /admin open.
      # Beta invitations are DID hashes in public/beta/invites.json instead.
      - name: Admin credentials
        env:
          BETA_HTPASSWD: ${{ secrets.BETA_HTPASSWD }}
        run: |
          if [ -z "$BETA_HTPASSWD" ]; then
            echo "BETA_HTPASSWD is empty: refusing to publish /admin unguarded" >&2
            exit 1
          fi
          printf '%s\n' "$BETA_HTPASSWD" > .benday-htpasswd
      - name: Publish
        uses: yitianyigexiangfa/ssh-scp-ssh-pipelines@v1.1.5
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          pass: ${{ secrets.PASS }}
          # the action joins these lines with && so each script must stay a
          # single line: no heredoc, no comments, and no $ expansion, which it
          # resolves on the runner instead of the server.
          first_ssh: mkdir -p ./www/benday.qex.at
          # This action's SCP targets are directories, including the account home.
          scp: |
            ./dist/* => ./www/benday.qex.at/
            ./dist/.htaccess => ./www/benday.qex.at/
            ./.benday-htpasswd => ./
          # ENVIRON["HOME"] is where the credential lives, so no document root can
          # serve it, and it is the only source of the absolute path. 644 because
          # the web server user must read it; the dotfile deny stays in the file.
          last_ssh: awk '{p=(ENVIRON["HOME"]!="")?ENVIRON["HOME"]:ENVIRON["PWD"]; gsub(/__HOME__/,p)}1' ./www/benday.qex.at/.htaccess > ./www/benday.qex.at/.htaccess.tmp && mv ./www/benday.qex.at/.htaccess.tmp ./www/benday.qex.at/.htaccess && grep -q 'AuthUserFile /' ./www/benday.qex.at/.htaccess && chmod 644 ./.benday-htpasswd && test -f ./.benday-htpasswd && stat -c '%a %n' ./.benday-htpasswd ./www/benday.qex.at/.htaccess
