<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="benday — a dithered, tensorpunk client for the bluesky network"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090909" />
    <link rel="icon" type="image/svg+xml" href="/benday.svg" />
    <title>benday // bluesky client</title>
    <script>
      try {
        const colors = {
          dark: '#090909',
          light: '#f4f2ef',
        }
        // An explicit appearance wins; absent or unusable settings follow system.
        // denied storage or malformed json means no usable stored preference;
        // the system fallback below still decides the first paint
        let stored = null
        try {
          stored = JSON.parse(localStorage.getItem('benday:settings') ?? 'null')
        } catch {
          stored = null
        }
        const state =
          typeof stored === 'object' && stored !== null && typeof stored.state === 'object'
            ? stored.state
            : null
        const appearance =
          state?.appearance === 'light' ||
          state?.appearance === 'dark' ||
          state?.appearance === 'system'
            ? state.appearance
            : 'system'
        const prefersLight =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: light)').matches
        const theme =
          appearance === 'light' || (appearance === 'system' && prefersLight)
            ? 'light'
            : 'dark'
        document.documentElement.dataset.theme = theme
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta !== null) {
          meta.setAttribute('content', colors[theme])
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
