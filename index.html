<!doctype html>
<html lang="en" data-theme="void">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="benday — a dithered, tensorpunk reader for the bluesky network"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07090c" />
    <link rel="icon" type="image/svg+xml" href="/benday.svg" />
    <title>benday // bluesky reader</title>
    <script>
      try {
        const colors = {
          void: '#07090c',
          bone: '#ddd6c6',
          oxide: '#0b0705',
          phosphor: '#040906',
          'catppuccin-mocha': '#1e1e2e',
          'catppuccin-latte': '#eff1f5',
          dracula: '#282a36',
          atom: '#282c34',
          'github-dark': '#0d1117',
          'github-light': '#ffffff',
          cyberpunk: '#05030d',
          cottagecore: '#f3ead8',
          'truth-to-materials': '#858585',
          bluesky: '#fbfdff',
          'pumpkin-ember': '#160b06',
          'toxic-midnight': '#05100b',
          'candy-crypt': '#1a0a1e',
          'dead-leaves': '#120f08',
        }
        const octoberOnly = new Set([
          'pumpkin-ember',
          'toxic-midnight',
          'candy-crypt',
          'dead-leaves',
        ])
        const stored = JSON.parse(localStorage.getItem('benday:settings') ?? 'null')
        let theme = stored?.state?.theme
        if (theme === 'duotone') {
          theme = 'cyberpunk'
          stored.state.theme = theme
          localStorage.setItem('benday:settings', JSON.stringify(stored))
        }
        if (octoberOnly.has(theme) && new Date().getMonth() !== 9) {
          theme = 'void'
          stored.state.theme = theme
          localStorage.setItem('benday:settings', JSON.stringify(stored))
        }
        if (typeof theme === 'string' && Object.hasOwn(colors, theme)) {
          document.documentElement.dataset.theme = theme
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta !== null) meta.setAttribute('content', colors[theme])
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
