# verify the staged snapshot, not the worktree, before every commit. pre-commit's
# node environment supplies node and pnpm; scripts/check-staged.mjs exports the
# index into its own temporary repository and runs the whole gate there.
# a local hook can be bypassed with --no-verify; it is not remote enforcement.
repos:
  - repo: local
    hooks:
      - id: benday-check
        name: verify staged benday
        language: node
        language_version: 24.21.0
        additional_dependencies: ["pnpm@12.16.1"]
        entry: node scripts/check-staged.mjs
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-commit]
